global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'deploy-api'
    static_configs:
      - targets: ['api:8080']
  # NOTE: worker metrics target removed — the worker binary registers Prometheus
  # metrics via prometheus.MustRegister() but does not serve them via HTTP.
  # Re-add when worker gets an HTTP metrics server with promhttp.Handler().
